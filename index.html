<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubo Mágico 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem; }
  h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.75rem; color: #fff; letter-spacing: 0.05em; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
  button { background: #ffffff14; border: 1px solid #ffffff30; color: #eee; border-radius: 8px; padding: 5px 13px; font-size: 13px; cursor: pointer; transition: background 0.15s; }
  button:hover { background: #ffffff28; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-shuffle { border-color: #7c6fff80; color: #b3aaff; }
  #btn-reset   { border-color: #ff666680; color: #ffaaaa; }
  #info { display: flex; gap: 20px; align-items: center; margin-bottom: 8px; font-size: 13px; color: #aaa; }
  #victory-msg { color: #66ffaa; font-weight: 600; display: none; }
  canvas { border-radius: 12px; border: 1px solid #ffffff18; cursor: grab; touch-action: none; display: block; }
  canvas:active { cursor: grabbing; }
  p.hint { font-size: 12px; color: #666; margin-top: 8px; }</style>
</head>
<body>
<h1>🧩 Cubo Mágico 3D</h1>
<div id="controls">
  <button id="btn-U">Top (U)</button>
  <button id="btn-D">Bottom (D)</button>
  <button id="btn-F">Front (F)</button>
  <button id="btn-B">Back (B)</button>
  <button id="btn-L">Left (L)</button>
  <button id="btn-R">Right (R)</button>
  <button id="btn-shuffle">🔀 Embaralhar</button>
  <button id="btn-reset">↺ Reset</button>
</div>
<div id="info">
  <span>Movimentos: <strong id="move-count">0</strong></span>
  <span id="victory-msg">🏆 Resolvido!</span>
</div>
<canvas id="cube-canvas"></canvas>
<p class="hint">Arraste para orbitar • Clique nos botões para girar faces</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// feat: criação dos 27 cubinhos com cores por face
(function(){

  const canvas = document.getElementById('cube-canvas');
  const W = Math.min(window.innerWidth - 32, 600), H = 420;
  canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  camera.position.set(4, 3.5, 5); camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 0.5);
  dl.position.set(5, 8, 5); scene.add(dl);

  // Paleta de cores das 6 faces (convenção padrão do cubo mágico):
  const COLORS = {
    R: 0x00cc44, L: 0x0055ff,
    U: 0xffffff, D: 0xffff00,
    F: 0xff4400, B: 0xff8800
  };

  const BLACK = 0x111111; // faces internas do cubo (não visíveis ao jogador)

  // GAP = 1.05: cada cubinho mede ~1 unidade, mas é posicionado
  const GAP = 1.05;

  let cubelets  = []; // array com todos os 27 cubinhos da cena
  let moveCount = 0;  // contador de movimentos do jogador
  let animating = false; // (usado nos commits seguintes)

  // makeCubelet(x, y, z): cria um único cubinho na posição (x, y, z).
  function makeCubelet(x, y, z) {
    const group = new THREE.Group();
    group.position.set(x * GAP, y * GAP, z * GAP); // posição na grade

    const geo = new THREE.BoxGeometry(0.92, 0.92, 0.92); // cubo ligeiramente menor que 1

    const mats = [
      new THREE.MeshLambertMaterial({ color: x ===  1 ? COLORS.R : BLACK }), // [0] direita
      new THREE.MeshLambertMaterial({ color: x === -1 ? COLORS.L : BLACK }), // [1] esquerda
      new THREE.MeshLambertMaterial({ color: y ===  1 ? COLORS.U : BLACK }), // [2] cima
      new THREE.MeshLambertMaterial({ color: y === -1 ? COLORS.D : BLACK }), // [3] baixo
      new THREE.MeshLambertMaterial({ color: z ===  1 ? COLORS.F : BLACK }), // [4] frente
      new THREE.MeshLambertMaterial({ color: z === -1 ? COLORS.B : BLACK }), // [5] atrás
    ];

    const mesh = new THREE.Mesh(geo, mats); // une geometria + materiais
    group.add(mesh);   // mesh entra no grupo
    scene.add(group);  // grupo entra na cena
    return group;
  }

  // buildCube(): constrói (ou reconstrói) o cubo completo.
  function buildCube() {
    cubelets.forEach(c => scene.remove(c)); // limpa os cubinhos existentes
    cubelets = [];

    for (let x = -1; x <= 1; x++)       // eixo X: esquerda → direita
      for (let y = -1; y <= 1; y++)     // eixo Y: baixo → cima
        for (let z = -1; z <= 1; z++)   // eixo Z: atrás → frente
          cubelets.push(makeCubelet(x, y, z));

    moveCount = 0;
    document.getElementById('move-count').textContent = 0;
    document.getElementById('victory-msg').style.display = 'none';
  }

  buildCube(); // inicializa o cubo ao carregar a página

  // Renderiza a cena uma vez para exibir o cubo estático
  renderer.render(scene, camera);


})();
</script>
</body>
</html>
