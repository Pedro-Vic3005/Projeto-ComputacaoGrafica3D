<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubo Mágico 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem; }
  h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.75rem; color: #fff; letter-spacing: 0.05em; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
  button { background: #ffffff14; border: 1px solid #ffffff30; color: #eee; border-radius: 8px; padding: 5px 13px; font-size: 13px; cursor: pointer; transition: background 0.15s; }
  button:hover { background: #ffffff28; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-shuffle { border-color: #7c6fff80; color: #b3aaff; }
  #btn-reset   { border-color: #ff666680; color: #ffaaaa; }
  #info { display: flex; gap: 20px; align-items: center; margin-bottom: 8px; font-size: 13px; color: #aaa; }
  #victory-msg { color: #66ffaa; font-weight: 600; display: none; }
  canvas { border-radius: 12px; border: 1px solid #ffffff18; cursor: grab; touch-action: none; display: block; }
  canvas:active { cursor: grabbing; }
  p.hint { font-size: 12px; color: #666; margin-top: 8px; }</style>
</head>
<body>
<h1>🧩 Cubo Mágico 3D</h1>
<div id="controls">
  <button id="btn-U">Top (U)</button>
  <button id="btn-D">Bottom (D)</button>
  <button id="btn-F">Front (F)</button>
  <button id="btn-B">Back (B)</button>
  <button id="btn-L">Left (L)</button>
  <button id="btn-R">Right (R)</button>
  <button id="btn-shuffle">🔀 Embaralhar</button>
  <button id="btn-reset">↺ Reset</button>
</div>
<div id="info">
  <span>Movimentos: <strong id="move-count">0</strong></span>
  <span id="victory-msg">🏆 Resolvido!</span>
</div>
<canvas id="cube-canvas"></canvas>
<p class="hint">Arraste para orbitar • Clique nos botões para girar faces</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// feat: rotação de faces com animação e pivot
(function(){

  const canvas = document.getElementById('cube-canvas');
  const W = Math.min(window.innerWidth - 32, 600), H = 420;
  canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  camera.position.set(4, 3.5, 5); camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 0.5); dl.position.set(5, 8, 5); scene.add(dl);
  const COLORS = { R: 0x00cc44, L: 0x0055ff, U: 0xffffff, D: 0xffff00, F: 0xff4400, B: 0xff8800 };
  const BLACK = 0x111111, GAP = 1.05;
  let cubelets = [], moveCount = 0, animating = false;
  function makeCubelet(x, y, z) {
    const group = new THREE.Group();
    group.position.set(x * GAP, y * GAP, z * GAP);
    const geo = new THREE.BoxGeometry(0.92, 0.92, 0.92);
    const mats = [
      new THREE.MeshLambertMaterial({ color: x===1?COLORS.R:BLACK }),
      new THREE.MeshLambertMaterial({ color: x===-1?COLORS.L:BLACK }),
      new THREE.MeshLambertMaterial({ color: y===1?COLORS.U:BLACK }),
      new THREE.MeshLambertMaterial({ color: y===-1?COLORS.D:BLACK }),
      new THREE.MeshLambertMaterial({ color: z===1?COLORS.F:BLACK }),
      new THREE.MeshLambertMaterial({ color: z===-1?COLORS.B:BLACK }),
    ];
    const mesh = new THREE.Mesh(geo, mats);
    group.add(mesh); scene.add(group); return group;
  }
  function buildCube() {
    cubelets.forEach(c => scene.remove(c)); cubelets = [];
    for (let x=-1;x<=1;x++) for (let y=-1;y<=1;y++) for (let z=-1;z<=1;z++)
      cubelets.push(makeCubelet(x, y, z));
    moveCount = 0;
    document.getElementById('move-count').textContent = 0;
    document.getElementById('victory-msg').style.display = 'none';
  }
  buildCube();

  // getFace(axis, val): retorna os 9 cubinhos de uma face específica.
  function getFace(axis, val) {
    return cubelets.filter(c => {
      const pos = new THREE.Vector3();
      c.getWorldPosition(pos); // posição absoluta, ignora hierarquia de grupos
      const v = axis === 'x' ? pos.x : axis === 'y' ? pos.y : pos.z;
      return Math.round(v / GAP) === val;
    });
  }

  // setAllButtons(disabled): habilita ou desabilita todos os botões.
  function setAllButtons(disabled) {
    document.querySelectorAll('button').forEach(b => b.disabled = disabled);
  }

  // rotateFace(axis, val, dir, onDone): rotaciona 90° uma face, com animação.
  function rotateFace(axis, val, dir, onDone) {
    if (animating) return;
    animating = true;
    setAllButtons(true);

    // ① Seleciona os 9 cubinhos da face
    const face = getFace(axis, val);

    // ② Cria o pivot e transfere os cubinhos para ele
    const pivot = new THREE.Group();
    scene.add(pivot);
    face.forEach(c => { scene.remove(c); pivot.add(c); });

    // Calcula o passo de rotação por frame
    const total = Math.PI / 2 * dir; // 90° em radianos, com direção
    const steps = 18;                // número de frames da animação
    const step  = total / steps;     // ângulo por frame ≈ 5°
    let frame   = 0;

    // ③ Loop de animação frame a frame
    function animate() {
      if (frame < steps) {
        // Incrementa a rotação do pivot no eixo correto
        if      (axis === 'x') pivot.rotation.x += step;
        else if (axis === 'y') pivot.rotation.y += step;
        else                   pivot.rotation.z += step;
        frame++;
        requestAnimationFrame(animate); // agenda o próximo frame (~60fps)
      } else {
        // ④ Animação concluída: desancora os cubinhos do pivot
        face.forEach(c => {
          // applyMatrix4(pivot.matrixWorld):
          c.applyMatrix4(pivot.matrixWorld);
          scene.add(c);
        });

        scene.remove(pivot); // pivot foi usado, pode ser descartado

        // Arredondamento: operações de float acumulam erros pequenos
        face.forEach(c => {
          ['x', 'y', 'z'].forEach(a => {
            c.position[a] = Math.round(c.position[a] / GAP) * GAP;
            c.rotation[a] = Math.round(c.rotation[a] / (Math.PI / 2)) * (Math.PI / 2);
          });
        });

        animating = false;
        setAllButtons(false);
        if (onDone) onDone(); // chama o próximo passo (ex: embaralhar encadeado)
      }
      renderer.render(scene, camera); // redesenha a cena a cada frame
    }

    animate(); // dispara o primeiro frame
    moveCount++;
    document.getElementById('move-count').textContent = moveCount;
  }

  // Liga os botões de face à função rotateFace
  // dir=-1 → rotação "positiva" visual | dir=1 → rotação "negativa" visual
  document.getElementById('btn-U').onclick = () => rotateFace('y',  1, -1);
  document.getElementById('btn-D').onclick = () => rotateFace('y', -1,  1);
  document.getElementById('btn-F').onclick = () => rotateFace('z',  1, -1);
  document.getElementById('btn-B').onclick = () => rotateFace('z', -1,  1);
  document.getElementById('btn-L').onclick = () => rotateFace('x', -1,  1);
  document.getElementById('btn-R').onclick = () => rotateFace('x',  1, -1);
  document.getElementById('btn-reset').onclick = buildCube;

  // Loop de renderização temporário (será substituído no Commit 6)
  function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); }
  loop();

})();
</script>
</body>
</html>
