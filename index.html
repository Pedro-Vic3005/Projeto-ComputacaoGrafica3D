<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubo Mágico 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem; }
  h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.75rem; color: #fff; letter-spacing: 0.05em; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
  button { background: #ffffff14; border: 1px solid #ffffff30; color: #eee; border-radius: 8px; padding: 5px 13px; font-size: 13px; cursor: pointer; transition: background 0.15s; }
  button:hover { background: #ffffff28; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-shuffle { border-color: #7c6fff80; color: #b3aaff; }
  #btn-reset   { border-color: #ff666680; color: #ffaaaa; }
  #info { display: flex; gap: 20px; align-items: center; margin-bottom: 8px; font-size: 13px; color: #aaa; }
  #victory-msg { color: #66ffaa; font-weight: 600; display: none; }
  canvas { border-radius: 12px; border: 1px solid #ffffff18; cursor: grab; touch-action: none; display: block; }
  canvas:active { cursor: grabbing; }
  p.hint { font-size: 12px; color: #666; margin-top: 8px; }</style>
</head>
<body>
<h1>🧩 Cubo Mágico 3D</h1>
<div id="controls">
  <button id="btn-U">Top (U)</button>
  <button id="btn-D">Bottom (D)</button>
  <button id="btn-F">Front (F)</button>
  <button id="btn-B">Back (B)</button>
  <button id="btn-L">Left (L)</button>
  <button id="btn-R">Right (R)</button>
  <button id="btn-shuffle">🔀 Embaralhar</button>
  <button id="btn-reset">↺ Reset</button>
</div>
<div id="info">
  <span>Movimentos: <strong id="move-count">0</strong></span>
  <span id="victory-msg">🏆 Resolvido!</span>
</div>
<canvas id="cube-canvas"></canvas>
<p class="hint">Arraste para orbitar • Clique nos botões para girar faces</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// feat: detecção de vitória, contador e embaralhar
(function(){

  // ── SETUP (Commits 1–4 consolidados) ────────────────────────
  const canvas = document.getElementById('cube-canvas');
  const W = Math.min(window.innerWidth - 32, 600), H = 420;
  canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  camera.position.set(4, 3.5, 5); camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 0.5); dl.position.set(5, 8, 5); scene.add(dl);
  const COLORS = { R: 0x00cc44, L: 0x0055ff, U: 0xffffff, D: 0xffff00, F: 0xff4400, B: 0xff8800 };
  const BLACK = 0x111111, GAP = 1.05;
  let cubelets = [], moveCount = 0, animating = false;
  function makeCubelet(x, y, z) {
    const group = new THREE.Group(); group.position.set(x*GAP, y*GAP, z*GAP);
    const geo = new THREE.BoxGeometry(0.92,0.92,0.92);
    const mats = [
      new THREE.MeshLambertMaterial({color:x===1?COLORS.R:BLACK}),
      new THREE.MeshLambertMaterial({color:x===-1?COLORS.L:BLACK}),
      new THREE.MeshLambertMaterial({color:y===1?COLORS.U:BLACK}),
      new THREE.MeshLambertMaterial({color:y===-1?COLORS.D:BLACK}),
      new THREE.MeshLambertMaterial({color:z===1?COLORS.F:BLACK}),
      new THREE.MeshLambertMaterial({color:z===-1?COLORS.B:BLACK}),
    ];
    const mesh = new THREE.Mesh(geo,mats); group.add(mesh); scene.add(group); return group;
  }
  function buildCube() {
    cubelets.forEach(c=>scene.remove(c)); cubelets=[];
    for(let x=-1;x<=1;x++) for(let y=-1;y<=1;y++) for(let z=-1;z<=1;z++) cubelets.push(makeCubelet(x,y,z));
    moveCount=0; document.getElementById('move-count').textContent=0; document.getElementById('victory-msg').style.display='none';
  }
  buildCube();
  function getFace(axis, val) {
    return cubelets.filter(c => { const pos=new THREE.Vector3(); c.getWorldPosition(pos); const v=axis==='x'?pos.x:axis==='y'?pos.y:pos.z; return Math.round(v/GAP)===val; });
  }
  function setAllButtons(disabled) { document.querySelectorAll('button').forEach(b=>b.disabled=disabled); }
  function rotateFace(axis, val, dir, onDone) {
    if(animating) return; animating=true; setAllButtons(true);
    const face=getFace(axis,val); const pivot=new THREE.Group(); scene.add(pivot);
    face.forEach(c=>{scene.remove(c);pivot.add(c);});
    const total=Math.PI/2*dir, steps=18, step=total/steps; let frame=0;
    function animate() {
      if(frame<steps) { if(axis==='x') pivot.rotation.x+=step; else if(axis==='y') pivot.rotation.y+=step; else pivot.rotation.z+=step; frame++; requestAnimationFrame(animate); }
      else {
        face.forEach(c=>{c.applyMatrix4(pivot.matrixWorld);scene.add(c);}); scene.remove(pivot);
        face.forEach(c=>{['x','y','z'].forEach(a=>{c.position[a]=Math.round(c.position[a]/GAP)*GAP;c.rotation[a]=Math.round(c.rotation[a]/(Math.PI/2))*(Math.PI/2);});});
        animating=false; setAllButtons(false); if(onDone) onDone(); checkVictory();
      }
      renderer.render(scene,camera);
    }
    animate(); moveCount++; document.getElementById('move-count').textContent=moveCount;
  }
  document.getElementById('btn-U').onclick = () => rotateFace('y',  1, -1);
  document.getElementById('btn-D').onclick = () => rotateFace('y', -1,  1);
  document.getElementById('btn-F').onclick = () => rotateFace('z',  1, -1);
  document.getElementById('btn-B').onclick = () => rotateFace('z', -1,  1);
  document.getElementById('btn-L').onclick = () => rotateFace('x', -1,  1);
  document.getElementById('btn-R').onclick = () => rotateFace('x',  1, -1);
  document.getElementById('btn-reset').onclick = buildCube;

  // checkVictory(): verifica se o cubo está completamente resolvido.
  function checkVictory() {
    const faceChecks = [
      { axis: 'y', val:  1, fi: 2 }, // face superior  (U)
      { axis: 'y', val: -1, fi: 3 }, // face inferior  (D)
      { axis: 'z', val:  1, fi: 4 }, // face frontal   (F)
      { axis: 'z', val: -1, fi: 5 }, // face traseira  (B)
      { axis: 'x', val:  1, fi: 0 }, // face direita   (R)
      { axis: 'x', val: -1, fi: 1 }, // face esquerda  (L)
    ];

    for (const fc of faceChecks) {
      const face = getFace(fc.axis, fc.val);
      if (!face.length) return; // segurança: sem cubinhos = algo errado

      // Coleta a cor (hex) do lado `fi` de cada cubinho da face
      const colors = face.map(c => c.children[0].material[fc.fi].color.getHex());

      // Se o Set tiver mais de 1 cor, essa face não está uniforme
      if (new Set(colors).size > 1) return;
    }

    // Todas as 6 faces passaram: cubo resolvido!
    // moveCount > 0 garante que não exibe vitória no estado inicial
    if (moveCount > 0) document.getElementById('victory-msg').style.display = 'inline';
  }

  // Botão Embaralhar: executa 20 rotações aleatórias em sequência,
  document.getElementById('btn-shuffle').onclick = function () {
    if (animating) return;

    // Todos os 6 movimentos possíveis (face + sentido)
    const axes = [['y',1,-1],['y',-1,1],['z',1,-1],['z',-1,1],['x',-1,1],['x',1,-1]];

    // Sorteia 20 movimentos aleatórios
    const moves = Array.from({ length: 20 }, () => axes[Math.floor(Math.random() * axes.length)]);

    // Zera o contador antes de embaralhar (o embaralho não conta como jogadas)
    moveCount = 0;
    document.getElementById('move-count').textContent = 0;
    document.getElementById('victory-msg').style.display = 'none';

    let i = 0;
    function next() {
      if (i < moves.length) {
        const m = moves[i++];
        rotateFace(m[0], m[1], m[2], next); // ao terminar, chama next novamente
      } else {
        // Embaralho concluído: zera para o jogador começar do zero
        moveCount = 0;
        document.getElementById('move-count').textContent = 0;
      }
    }
    next(); // dispara o primeiro movimento
  };

  // Loop de renderização (será mantido no Commit 6)
  function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); }
  loop();

})();
</script>
</body>
</html>
